# Synthetic demo vault (public). Run: python -m tvrag.run --config configs/demo.yaml
snapshot_id: demo
paths:
  snapshot: demo/vault
  chunks: demo/build/chunks.jsonl
  index: demo/build/index
  eval_set: demo/eval.jsonl
  results: demo/results
  facts_source: demo/facts.jsonl
  facts: demo/build/facts.jsonl
ingest:
  doc_type_dirs:
    topic: topics
    session: sessions
chunk:
  max_tokens: 512
  min_tokens: 64
embedding:
  model: BAAI/bge-m3
  device: cpu
  batch_size: 8
  normalize: true
bm25:
  tokenizer: kiwipiepy
retrieve:
  top_k: 5
  rrf_k: 60
  candidates: 50   # N: top-N from each retriever goes into RRF (mode B)
  c:               # mode C (S5); values fixed on the demo set and dev questions
    as_of_filter: pre      # pre | post: drop date_min > as_of before or after fusion
    half_life_days: 60     # 현재 값: score * 0.5 ** (age / half_life), age = now - date_max
    change_pool: 30        # 변화 추적: B candidates scanned for distinct dates
    reference_date: "2025-06-30"  # default 'now' (eval questions carry their own)
eval:
  doc_prefix: ""   # gold_docs and chunk doc_path share the vault root here
  k: 5
  depth: 20        # MRR is computed over this many retrieved chunks
  history_k: 10    # 변화 추적: change points must be covered by the top history_k chunks
  bootstrap: 2000
  seed: 0
run:
  rechunk: true
facts:            # mode D (S6): fact table built from demo/facts.jsonl (scripts/write_demo_facts.py)
  default_series:          # attribute -> series that answers 현재 값 (and leads 시점 고정 / 변화 추적)
    체중: 아침 공복
  change_series: {}        # attribute -> extra series chained into 시점 고정 / 변화 추적 answers
  max_evidence_per_row: 2  # evidence chunks per answer row in the ranked list
