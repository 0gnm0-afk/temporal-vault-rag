# Example config. Copy to configs/local.yaml (gitignored) and edit.
# Paths are relative to the repo root. Private data lives in a sibling folder
# outside the repo; subfolders: snapshots/<id>, index, eval, results.
snapshot_id: "<wiki-commit-hash>"
paths:
  private_root: ../private
  # Optional overrides (defaults derive from private_root and snapshot_id):
  # snapshot, chunks, index, results
  eval_set: "<eval-set.jsonl>"  # path to the eval set (keep it under private_root)
  # facts_source / facts: mode D observation file and built table
  # (default: <private_root>/facts/<snapshot_id>.obs.jsonl and .jsonl)
ingest:
  # doc_type -> folder name (any path component) inside the snapshot
  doc_type_dirs:
    topic: "<topic-notes-folder>"
    session: "<session-notes-folder>"
chunk:
  max_tokens: 512  # bge-m3 tokens
  min_tokens: 64
embedding:
  model: BAAI/bge-m3
  device: cpu
  batch_size: 8
  normalize: true
bm25:
  tokenizer: kiwipiepy
retrieve:
  top_k: 5
  rrf_k: 60
  candidates: 50   # N: top-N from each retriever goes into RRF (mode B)
  c:               # mode C (S5); values fixed on the demo set and dev questions
    as_of_filter: pre      # pre | post: drop date_min > as_of before or after fusion
    half_life_days: 60     # 현재 값: score * 0.5 ** (age / half_life), age = now - date_max
    change_pool: 30        # 변화 추적: B candidates scanned for distinct dates
    reference_date: null    # default 'now'; null = today
eval:
  doc_prefix: "<vault-area-folder>"  # gold_docs and doc_path are cut after this folder
  k: 5
  depth: 20        # MRR is computed over this many retrieved chunks
  history_k: 10    # 변화 추적: change points must be covered by the top history_k chunks
  bootstrap: 2000
  seed: 0
facts:            # mode D (fact table); see tvrag.facts
  default_series: {}       # attribute -> condition series that answers 현재 값, e.g. {체중: 아침 공복}
  change_series: {}        # attribute -> extra series chained into 시점 고정 / 변화 추적
  max_evidence_per_row: 2  # evidence chunks per answer row in the ranked list
